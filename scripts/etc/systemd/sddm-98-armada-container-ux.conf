[Service]
# SDDM does not exit on SIGTERM once a session is attached: it relays the signal
# to the session and then waits for the session to go away, which never happens
# cleanly here because the container has no VT for the session to be logged out
# of. `systemctl stop sddm` therefore sat for the full TimeoutStopSec, adding a
# flat 15 s to every mode switch (measured 21:29:21.007 -> 21:29:36.123 in the
# armada-container-session log).
#
# The session teardown is done explicitly by container-action after this point
# (it stops graphical-session.target and the plasma/gamescope units itself), so
# SDDM does not need to wait for it. Keep a short grace period for a clean exit
# and then let systemd kill the whole cgroup.
TimeoutStopSec=3
KillMode=control-group
SendSIGKILL=yes
TimeoutStopFailureMode=kill