# x86 / x86-64 ELF -> box64, the boot default. Read by box64-binfmt (and therefore
# by box64-binfmt.service) and installed to /usr/lib/binfmt.d/box64.conf.
#
# No P flag on purpose: with P the kernel passes the original argv[0] ahead of the
# binary path, box64 takes that as the program name, and every guest then sees its
# own path as an extra argument (measured: `echo one two` printed the path,
# `uname -m` reported "extra operand"). FEX reorders argv itself and keeps P.
:box64-x86_64:M:0:\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/box64:
:box64-i386:M:0:\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x03\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/box64:
