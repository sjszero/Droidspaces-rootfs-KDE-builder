# MangoHud performance overlay levels, tuned for the Droidspaces/ArmadaOS
# container (kgsl GPU, cgroup v2 without a memory controller, Steam big picture
# through gamescope/anland).
#
# Steam's "性能叠加界面等级" writes `preset=N` into MANGOHUD_CONFIGFILE and lets
# mangoapp read it, so these sections decide what each level shows. The ladder
# follows Steam Deck's: 1 answers "how fast", 2 adds "is it throttling",
# 3 adds per-core and efficiency detail, 4 adds frame/system/driver breakdown.
# Only metrics that actually resolve inside the container are enabled:
#
#   works    fps / frametime        gamescope stats stream (anland mangoapp nudge)
#            gpu_stats, gpu_temp,    kgsl-3d0 (clock_mhz, gpu_busy_percentage,
#            gpu_core_clock          temp) via the container hwmon patch
#            cpu_stats, cpu_mhz,     sysfs cpufreq + /proc/stat
#            core_load               per-core utilisation
#            cpu_efficiency          kernel energy model + cpufreq time_in_state
#            cpu_temp                /sys/class/thermal zones
#            cpu_power               energy model (the patch's EAS backend)
#            ram                     meminfo
#            battery, battery_watt,  power_supply (incl. time-to-empty)
#            battery_time
#   absent   gpu_power, gpu_voltage, gpu_fan, gpu_mem_temp   need /sys/class/hwmon
#            gpu_efficiency          divides by gpu_power: would print inf
#            vram, gpu_mem_clock     amdgpu/i915 only
#            proc_vram               msm fdinfo exposes no vram counters
#            present_mode            the GL path only reports a static ON/OFF
#            cgroup_mem              this cgroup has no memory controller
#            fan, throttling_status  no cooling-device attributes exposed
#
# Every key below is in MangoHud's OVERLAY_PARAMS list; an unknown key only
# prints "Unknown option" at runtime and is dropped, so keep them in sync when
# the pinned MangoHud commit moves.
#
# Levels deliberately do not set position or font size: top-left is MangoHud's
# default and the anland overlay window is the full output size, so the HUD
# lands where Steam's own overlay would.
[preset 1]
# How fast: frame rate only, compact, no graphs.
fps=1
fps_only=1
hud_compact=1
frametime=0
frame_timing=0
gpu_stats=0
cpu_stats=0
ram=0
battery=0
text_outline=1
[preset 2]
# Is it throttling: frame rate, frame graph, clocks, temperatures, power,
# memory and battery.
fps=1
fps_only=0
frametime=1
frame_timing=1
frame_timing_detailed=0
fps_sampling_period=500
gpu_stats=1
cpu_stats=1
core_load=0
gpu_core_clock=1
cpu_mhz=1
gpu_temp=1
cpu_temp=1
cpu_power=1
ram=1
battery=1
battery_watt=1
text_outline=1
[preset 3]
# Where the time goes: level 2 plus per-core load, CPU efficiency, frame rate
# percentiles, refresh rate and the battery estimate.
fps=1
fps_only=0
frametime=1
frame_timing=1
frame_timing_detailed=0
fps_sampling_period=500
fps_metrics=1
gpu_stats=1
cpu_stats=1
core_load=1
cpu_max_core_load=1
gpu_core_clock=1
cpu_mhz=1
gpu_temp=1
cpu_temp=1
cpu_power=1
cpu_efficiency=1
ram=1
battery=1
battery_watt=1
battery_time=1
refresh_rate=1
show_fps_limit=1
text_outline=1
[preset 4]
# Everything that resolves, plus detailed frame timing and system/driver detail.
fps=1
fps_only=0
frametime=1
frame_timing=1
frame_timing_detailed=1
frame_count=1
fps_sampling_period=500
fps_metrics=1
gpu_stats=1
cpu_stats=1
core_load=1
cpu_max_core_load=1
gpu_core_clock=1
cpu_mhz=1
gpu_temp=1
cpu_temp=1
cpu_power=1
cpu_efficiency=1
ram=1
procmem=1
io_read=1
io_write=1
battery=1
battery_watt=1
battery_time=1
network=1
refresh_rate=1
resolution=1
arch=1
vulkan_driver=1
gpu_name=1
engine_version=1
display_server=1
show_fps_limit=1
debug=1
text_outline=1
# Kept explicit at 0 so a future device flip is one edit (the header explains why
# each of these resolves to nothing on this hardware):
vram=0
gpu_power=0
gpu_voltage=0
gpu_fan=0
gpu_junction_temp=0
gpu_mem_temp=0
gpu_mem_clock=0
gpu_power_limit=0
gpu_efficiency=0
proc_vram=0
cgroup_mem=0
present_mode=0
fan=0
throttling_status=0
throttling_status_graph=0
hdr=0
legacy_layout=0