# MangoHud performance overlay levels for the Droidspaces/ArmadaOS container
# (kgsl GPU, no /sys/class/hwmon, cgroup v2 without a memory controller, Steam
# big picture through gamescope/anland).
#
# Steam's "性能叠加界面等级" writes `preset=N` into MANGOHUD_CONFIGFILE and lets
# mangoapp read it, so these sections decide what each level shows. Because all
# four sections exist here, MangoHud's own built-in presets() cases never run
# (parse_preset_config() returns first), so each section is written out in full
# instead of relying on the built-in inheritance.
#
#   1  fps only                      (built-in case 1)
#   2  fps + frame graph, one row    (built-in case 2: horizontal strip)
#   3  level 2 as a vertical block,  (same fields, plus clocks/temps/refresh)
#      plus the detail level 2 has no room for
#   4  MANGOHUD_CONFIG=full minus the rows this hardware cannot fill
#
# Where each row comes from inside the container (levels 1-3 only enable the
# first group, level 4 starts from `full` and subtracts the second):
#
#   works    fps / frametime        gamescope stats stream (anland mangoapp nudge)
#            gpu_stats, gpu_temp,    kgsl-3d0 (clock_mhz, gpu_busy_percentage,
#            gpu_core_clock          temp) via the container hwmon patch
#            cpu_stats, cpu_mhz,     sysfs cpufreq + /proc/stat
#            core_load               per-core utilisation
#            cpu_efficiency          kernel energy model + cpufreq time_in_state
#            cpu_temp                /sys/class/thermal zones
#            cpu_power               energy model (the patch's EAS backend)
#            ram                     meminfo
#            battery, battery_watt,  power_supply (incl. time-to-empty)
#            battery_time
#            io_read, io_write       /proc/self/io (0 while idle, real under load)
#            resolution,             gamescope output + X11 atoms
#            display_server,
#            present_mode,
#            refresh_rate
#   absent   gpu_power, gpu_voltage, gpu_fan, gpu_mem_temp   need /sys/class/hwmon
#            gpu_efficiency          divides by gpu_power: would print inf
#            gpu_junction_temp       no junction sensor exposed
#            vram, gpu_mem_clock     amdgpu/i915 only
#            proc_vram               msm fdinfo exposes no vram counters
#            cgroup_mem              this cgroup has no memory controller
#            fan, throttling_status  no cooling-device attributes exposed
#            wine, winesync          no Wine layer in this session
#
# legacy_layout is left at its default (1). In 0.8.4 that is what builds the
# standard row set in the standard order (GPU, CPU, RAM, BATT, FPS, frame
# graph, ..., refresh rate); setting it to 0 renders only the keys listed in
# the section, which collapses the overlay to a couple of rows. `fps_only`
# forces it off for level 1, which is why level 1 is a single row.
#
# Every key below is in MangoHud's OVERLAY_PARAMS list; an unknown key only
# prints "Unknown option" at runtime and is dropped, so keep them in sync when
# the pinned MangoHud commit moves.
#
# Levels deliberately do not set position or font size: top-left is MangoHud's
# default and the anland overlay window is the full output size, so the HUD
# lands where Steam's own overlay would.
[preset 1]
# Frame rate only.
fps=1
fps_only=1
cpu_stats=0
gpu_stats=0
frametime=0
frame_timing=0
debug=0
text_outline=1
[preset 2]
# The frame rate and the frame graph on one row (MangoHud's own level 2 shape),
# with every device metric that resolves here.
horizontal=1
table_columns=20
hud_no_margin=1
fps=1
fps_only=0
frame_timing=1
frametime=0
frame_timing_detailed=0
fps_sampling_period=500
cpu_stats=1
gpu_stats=1
ram=1
battery=1
battery_watt=1
battery_time=1
cpu_power=1
vram=0
gpu_power=0
text_outline=1
[preset 3]
# Level 2's fields as an ordinary vertical block (no horizontal strip), plus the
# clocks, temperatures and refresh rate that do not fit on one row. No per-core
# list, no percentiles, no FPS limit row: those belong to level 4 and made this
# level read as noise.
fps=1
fps_only=0
horizontal=0
frametime=1
frame_timing=1
frame_timing_detailed=0
fps_sampling_period=500
gpu_stats=1
gpu_core_clock=1
gpu_temp=1
cpu_stats=1
cpu_mhz=1
cpu_temp=1
cpu_power=1
ram=1
battery=1
battery_watt=1
battery_time=1
refresh_rate=1
text_outline=1
[preset 4]
# `full` as the base - that is what MANGOHUD_CONFIG=full renders - with the rows
# this hardware cannot fill switched back off, so every row that remains shows a
# real value. Order does not matter: `full` is expanded before the keys below.
full=1
# 1% and 0.1% low frame rates. fps_metrics takes fractions of the frame time
# distribution (AVG is also accepted): 0.01 -> "1%", 0.001 -> "0.1%".
fps_metrics=0.01,0.001
# No hwmon sensors: RPM, volts, GPU watts, junction/memory temperature, fan.
gpu_fan=0
gpu_voltage=0
gpu_power=0
gpu_junction_temp=0
gpu_mem_temp=0
gpu_power_limit=0
fan=0
throttling_status=0
throttling_status_graph=0
# Divides by gpu_power, so it would print inf.
gpu_efficiency=0
# amdgpu/i915 only, and msm exposes no vram counters.
vram=0
gpu_mem_clock=0
proc_vram=0
# This cgroup has no memory controller, the row would be empty.
cgroup_mem=0
# No Wine layer in this session.
wine=0
winesync=0
