name: 构建并发布 Anland KDE Wayland 软件包
run-name: Anland KDE 软件包 ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 选择构建目标；all 中失败的平台沿用上一份完整 Release，单个平台只替换选中的包
        required: true
        type: choice
        default: all
        options:
          - all
          - ubuntu2604
          - Debian13
          - Fedora43
          - Fedora44
          - Arch
      anland_ref:
        description: 要构建的 Anland 分支、标签或提交
        required: true
        type: string
        default: main
      anland_repo:
        description: Anland 仓库地址
        required: true
        type: string
        default: https://github.com/superturtlee/anland.git
      request_id:
        description: 可选的调用方请求 ID
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  # 固定 Release 会被原地重写，必须串行更新。
  group: anland-kde-package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析 Anland 源码版本
    runs-on: ubuntu-latest
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2604","Debian13","Fedora43","Fedora44","Arch"]'
              ;;
            ubuntu2604|Debian13|Fedora43|Fedora44|Arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将请求的源解析为单个提交
        id: resolve
        env:
          ANLAND_REPO: ${{ inputs.anland_repo }}
          ANLAND_REF: ${{ inputs.anland_ref }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(mktemp -d)/anland"
          trap 'rm -rf "${source_dir%/anland}"' EXIT
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
          anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
          echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
          echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"

  build:
    name: 构建 ${{ matrix.target }} 软件包
    needs: prepare
    runs-on: ubuntu-24.04-arm
    # 单个平台失败不阻止其余包和 Release 合并；Release 阶段会复用上一版该平台资产。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    env:
      ANLAND_REPO: ${{ inputs.anland_repo }}
      ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
      BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: 解析构建目标
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET" in
            ubuntu2604)
              image=ubuntu:26.04
              script=producers/kde/ubuntu2604_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-ubuntu2604-kwin-
              asset_arch=arm64
              archive_target=ubuntu2604
              ;;
            Debian13)
              image=debian:trixie
              script=producers/kde/Debian13_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-debian13-kwin-
              asset_arch=arm64
              archive_target=debian13
              ;;
            Fedora43)
              image=fedora:43
              script=producers/kde/Fedora43_v5/build.sh
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora43-kwin-
              asset_arch=aarch64
              archive_target=fedora43
              ;;
            Fedora44)
              image=fedora:44
              # Fedora 44 使用 Fedora 43 的构建脚本，配 Fedora 44 基础镜像。
              script=producers/kde/Fedora43_v5/build.sh
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora44-kwin-
              asset_arch=aarch64
              archive_target=fedora44
              ;;
            Arch)
              image=ogarcia/archlinux:latest
              script=producers/kde/Arch_v5/build.sh
              package_pattern='*.pkg.tar.*'
              asset_prefix=anland-kde-arch-kwin-
              asset_arch=aarch64
              archive_target=arch
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET" >&2
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "script=$script"
            echo "package_pattern=$package_pattern"
            echo "asset_prefix=$asset_prefix"
            echo "asset_arch=$asset_arch"
            echo "archive_target=$archive_target"
          } >> "$GITHUB_OUTPUT"

      - name: 在对应的发行版中构建软件包
        env:
          DISTRO_IMAGE: ${{ steps.target.outputs.image }}
          BUILD_SCRIPT: ${{ steps.target.outputs.script }}
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          docker run --rm -i \
            --platform linux/arm64 \
            -e ANLAND_REPO \
            -e ANLAND_COMMIT \
            -e BUILD_SCRIPT \
            -e BUILD_TARGET \
            -e PKG_PATTERN \
            -v "$PWD/$OUTPUT_DIR:/root/kde-packages" \
            -v "$PWD/$OUTPUT_DIR:/tmp/kde-packages" \
            "$DISTRO_IMAGE" \
            bash -s <<'ANLAND_BUILD'
              set -euo pipefail

              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    git ca-certificates sudo \
                    build-essential devscripts dpkg-dev fakeroot patch
                  ;;
                Fedora43|Fedora44)
                  dnf install -y --setopt=install_weak_deps=False \
                    git ca-certificates sudo \
                    dnf-plugins-core rpmdevtools rpm-build patch tar xz
                  ;;
                Arch)
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm --needed base-devel git ca-certificates sudo
                  useradd -m -s /bin/bash anland
                  printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
                  chmod 0440 /etc/sudoers.d/anland-pacman
                  if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
                    sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
                  else
                    printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
                  fi
                  chown -R anland:anland /tmp/kde-packages
                  ;;
              esac

              git init --quiet /tmp/anland
              git -C /tmp/anland remote add origin "$ANLAND_REPO"
              git -C /tmp/anland fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
              git -C /tmp/anland checkout --quiet --detach FETCH_HEAD

              # Debian 13 使用 DEB822 源；上游构建脚本要求 deb-src。
              if [ "$BUILD_TARGET" = Debian13 ] && [ -f /etc/apt/sources.list.d/debian.sources ]; then
                sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
                apt-get update
              fi

              test -f "/tmp/anland/$BUILD_SCRIPT"
              chmod +x "/tmp/anland/$BUILD_SCRIPT"

              if [ "$BUILD_TARGET" = Arch ]; then
                su -s /bin/bash anland -c "cd /tmp/anland/$(dirname "$BUILD_SCRIPT") && WORKDIR=/tmp/kde-packages ./$(basename "$BUILD_SCRIPT") --noconfirm"
                chmod -R a+rwX /tmp/kde-packages
              else
                cd "/tmp/anland/$(dirname "$BUILD_SCRIPT")"
                WORKDIR=/root/kde-packages sudo -E "./$(basename "$BUILD_SCRIPT")"
              fi

              # 从主 kwin 包读取上游版本；不要把发行版打包修订号放进资产名。
              kwin_package=""
              kwin_version=""
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-wayland_*.deb' -print | sort | head -n1)"
                  if [ -z "$kwin_package" ]; then
                    kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-x11_*.deb' -print | sort | head -n1)"
                  fi
                  [ -n "$kwin_package" ] || { echo "未找到 kwin deb 包" >&2; exit 1; }
                  kwin_version="$(dpkg-deb -f "$kwin_package" Version)"
                  ;;
                Fedora43|Fedora44)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.rpm' -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin rpm 包" >&2; exit 1; }
                  kwin_version="$(rpm -qp --queryformat '%{VERSION}' "$kwin_package")"
                  ;;
                Arch)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.pkg.tar.*' -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin Arch 包" >&2; exit 1; }
                  kwin_version="$(pacman -Qp "$kwin_package" | awk 'NR == 1 { print $2 }')"
                  ;;
              esac
              # 去掉 epoch 和发行版/Arch 的 pkgrel，只保留 KWin 上游版本。
              kwin_version="${kwin_version#*:}"
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604|Arch) kwin_version="${kwin_version%-*}" ;;
              esac
              [ -n "$kwin_version" ] || { echo "无法解析 KWin 版本" >&2; exit 1; }
              printf '%s\n' "$kwin_version" > /tmp/kde-packages/.kwin-version
          ANLAND_BUILD

      - name: 打包 Release 资产
        id: package
        env:
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          ASSET_PREFIX: ${{ steps.target.outputs.asset_prefix }}
          ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
          ARCHIVE_TARGET: ${{ steps.target.outputs.archive_target }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/anland-kde-packages/$ARCHIVE_TARGET"
          asset_dir="$GITHUB_WORKSPACE/.release-assets/$BUILD_TARGET"
          rm -rf "$package_dir" "$asset_dir"
          mkdir -p "$package_dir" "$asset_dir"

          copy_packages() {
            local source_dir="$1"
            [ -d "$source_dir" ] || return 0
            find "$source_dir" -type f -name "$PKG_PATTERN" \
              ! -name '*debug*' ! -name '*dbgsym*' ! -name '*.src.*' \
              ! -name 'kwin-dev_*' ! -name 'kwin-devel-*' ! -name 'kwin-doc-*' \
              ! -name 'xorg-x11-server-Xwayland-devel-*' -exec cp -v {} "$package_dir/" \;
          }

          if [ "$BUILD_TARGET" = Arch ]; then
            copy_packages "$OUTPUT_DIR"
          else
            copy_packages "$OUTPUT_DIR/kwin"
            copy_packages "$OUTPUT_DIR/xwayland"
            copy_packages "$OUTPUT_DIR/xorg-x11-server-Xwayland"
          fi

          package_count="$(find "$package_dir" -maxdepth 1 -type f -name "$PKG_PATTERN" | wc -l)"
          if [ "$package_count" -eq 0 ]; then
            echo "未为 $BUILD_TARGET 收集到任何可安装的软件包" >&2
            exit 1
          fi

          kwin_version="$(tr -d '[:space:]' < "$OUTPUT_DIR/.kwin-version")"
          case "$kwin_version" in
            ''|*[!A-Za-z0-9.+~_-]*)
              echo "KWin 版本包含不支持用于文件名的字符：$kwin_version" >&2
              exit 1
              ;;
          esac
          asset_name="${ASSET_PREFIX}${kwin_version}-${ASSET_ARCH}.tar.gz"
          asset_path="$asset_dir/$asset_name"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'target=%s\nkwin_version=%s\nbuild_time=%s\n' \
            "$ARCHIVE_TARGET" "$kwin_version" "$build_time" > "$package_dir/.anland-kde-build-info"
          tar -C "$RUNNER_TEMP" -czf "$asset_path" "anland-kde-packages/$ARCHIVE_TARGET"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "已将 $package_count 个文件打包进 $asset_name（构建时间：$build_time）"

      - name: 上传 Release 资产
        uses: actions/upload-artifact@v6
        with:
          name: anland-kde-package-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 更新 Anland KDE 滚动 Release
    needs: [prepare, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出安装脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 下载软件包资产
        if: ${{ always() }}
        uses: actions/download-artifact@v7
        with:
          pattern: anland-kde-package-*
          path: release-assets
          merge-multiple: true

      - name: 创建固定 Release 与软件包清单
        env:
          GH_TOKEN: ${{ github.token }}
          ANLAND_REPO: ${{ inputs.anland_repo }}
          ANLAND_REF: ${{ inputs.anland_ref }}
          ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
          # 此令牌只暴露给不执行外部构建脚本的 Release 步骤。
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RELEASE_REPOSITORY: ${{ vars.GITEE_RELEASE_REPOSITORY || 'Zxc20060226/Droidspaces-rootfs-KDE-builder' }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$release_dir"
          rolling_release_tag="anland-kde-packages"
          release_targets=(Arch Debian13 ubuntu2604 Fedora43 Fedora44)
          declare -A asset_by_target=()
          declare -A asset_time_by_target=()
          declare -A asset_source_by_target=()
          updated_targets=()
          reused_targets=()
          build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          asset_prefix_for_target() {
            case "$1" in
              Arch) printf '%s\n' 'anland-kde-arch-kwin-' ;;
              Debian13) printf '%s\n' 'anland-kde-debian13-kwin-' ;;
              ubuntu2604) printf '%s\n' 'anland-kde-ubuntu2604-kwin-' ;;
              Fedora43) printf '%s\n' 'anland-kde-fedora43-kwin-' ;;
              Fedora44) printf '%s\n' 'anland-kde-fedora44-kwin-' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          target_label() {
            case "$1" in
              Arch) printf '%s\n' 'Arch Linux' ;;
              Debian13) printf '%s\n' 'Debian 13' ;;
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              Fedora43) printf '%s\n' 'Fedora 43' ;;
              Fedora44) printf '%s\n' 'Fedora 44' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          asset_arch_for_target() {
            case "$1" in
              Arch|Fedora43|Fedora44) printf '%s\n' 'aarch64' ;;
              Debian13|ubuntu2604) printf '%s\n' 'arm64' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          archive_target_for_target() {
            case "$1" in
              Arch) printf '%s\n' 'arch' ;;
              Debian13) printf '%s\n' 'debian13' ;;
              ubuntu2604) printf '%s\n' 'ubuntu2604' ;;
              Fedora43) printf '%s\n' 'fedora43' ;;
              Fedora44) printf '%s\n' 'fedora44' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          local_asset_for_target() {
            local target="$1"
            local prefix arch
            local path
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            while IFS= read -r path; do
              candidates+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*-${arch}.tar.gz" -print | sort)
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 0 ]; then
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          release_assets_tag=""
          release_assets=""
          load_release_assets() {
            local tag="$1"
            if [ "$release_assets_tag" = "$tag" ]; then
              return 0
            fi
            if ! release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"; then
              return 1
            fi
            release_assets_tag="$tag"
          }

          release_asset_for_target() {
            local tag="$1"
            local target="$2"
            local prefix arch name
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            load_release_assets "$tag" || return 1
            while IFS= read -r name; do
              case "$name" in
                "${prefix}"*"-${arch}.tar.gz") candidates+=("$name") ;;
              esac
            done <<< "$release_assets"
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "Release ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 1 ]; then
              printf '%s\n' "${candidates[0]}"
              return 0
            fi
            return 1
          }

          archive_build_time() {
            local archive="$1"
            local target="$2"
            local archive_target metadata build_timestamp
            archive_target="$(archive_target_for_target "$target")"
            if ! metadata="$(tar -xOzf "$archive" "anland-kde-packages/$archive_target/.anland-kde-build-info" 2>/dev/null)"; then
              return 1
            fi
            build_timestamp="$(printf '%s\n' "$metadata" | sed -n 's/^build_time=//p' | sed -n '1p')"
            [ -n "$build_timestamp" ] || return 1
            printf '%s\n' "$build_timestamp"
          }

          previous_tag=""
          previous_release_time=""
          # 固定 Release 有几个平台就能沿用几个；第一次构建时它还不存在，返回 1 即可。
          find_previous_release() {
            local stable_candidate

            stable_candidate="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null)" || return 1
            [ "$stable_candidate" = "$rolling_release_tag" ] || return 1
            release_assets_tag=""
            load_release_assets "$rolling_release_tag" || return 1
            previous_tag="$rolling_release_tag"
            previous_release_time="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq '.published_at // empty')" || return 1
            return 0
          }

          case "$BUILD_TARGET_INPUT" in
            all)
              selected_prefix=""
              ;;
            ubuntu2604)
              selected_prefix="$(asset_prefix_for_target ubuntu2604)"
              ;;
            Debian13)
              selected_prefix="$(asset_prefix_for_target Debian13)"
              ;;
            Fedora43)
              selected_prefix="$(asset_prefix_for_target Fedora43)"
              ;;
            Fedora44)
              selected_prefix="$(asset_prefix_for_target Fedora44)"
              ;;
            Arch)
              selected_prefix="$(asset_prefix_for_target Arch)"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          missing_targets=()
          for target in "${release_targets[@]}"; do
            if asset="$(local_asset_for_target "$target")"; then
              if ! asset_build_time="$(archive_build_time "$release_dir/$asset" "$target")"; then
                echo "本次构建资产 $asset 缺少构建时间元数据。" >&2
                exit 1
              fi
              asset_by_target["$target"]="$asset"
              asset_time_by_target["$target"]="$asset_build_time"
              asset_source_by_target["$target"]='本次构建'
              updated_targets+=("$target")
            else
              asset_status=$?
              [ "$asset_status" -eq 1 ] || exit "$asset_status"
              missing_targets+=("$target")
            fi
          done

          # 单平台选择失败时不更新滚动 Release；其他平台始终从固定 Release 补齐。
          if [ -n "$selected_prefix" ]; then
            selected_target="$BUILD_TARGET_INPUT"
            selected_missing=false
            for target in "${missing_targets[@]}"; do
              if [ "$target" = "$selected_target" ]; then
                selected_missing=true
                break
              fi
            done
            if [ "$selected_missing" = true ]; then
              echo "选择的 ${selected_target} 构建没有生成新资产，本次不更新滚动 Release。" >&2
              exit 1
            fi
          fi

          # 固定 Release 里有的平台就沿用，没有的（例如第一次只构建单个平台）本次先缺着，
          # 等后续构建补上，不再因为凑不齐五个平台就整体失败。
          unavailable_targets=()
          if [ "${#missing_targets[@]}" -gt 0 ]; then
            previous_dir="$RUNNER_TEMP/anland-kde-previous-assets"
            rm -rf "$previous_dir"
            mkdir -p "$previous_dir"
            find_previous_release || echo "固定 Release 还不存在或不可读，本次只发布已构建的平台。"

            for target in "${missing_targets[@]}"; do
              asset=""
              if [ -n "$previous_tag" ]; then
                if asset="$(release_asset_for_target "$previous_tag" "$target")"; then
                  :
                else
                  asset_status=$?
                  [ "$asset_status" -eq 1 ] || exit "$asset_status"
                  asset=""
                fi
              fi
              if [ -z "$asset" ]; then
                unavailable_targets+=("$target")
                continue
              fi
              gh release download "$previous_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir "$previous_dir"
              reused_asset="$asset"
              cp "$previous_dir/$asset" "$release_dir/$reused_asset"
              asset_by_target["$target"]="$reused_asset"
              if reused_build_time="$(archive_build_time "$release_dir/$reused_asset" "$target")"; then
                if [ "$reused_build_time" = unknown ]; then
                  asset_time_by_target["$target"]="${previous_release_time:-未知}（包未记录构建时间）"
                else
                  asset_time_by_target["$target"]="$reused_build_time（沿用）"
                fi
              else
                asset_time_by_target["$target"]="${previous_release_time:-未知}（沿用，未记录构建时间）"
              fi
              asset_source_by_target["$target"]="沿用 ${previous_tag}"
              reused_targets+=("$target")
            done
          fi

          if [ "${#updated_targets[@]}" -eq 0 ]; then
            echo "本次没有任何平台生成新资产，不更新滚动 Release。" >&2
            exit 1
          fi

          if [ "${#unavailable_targets[@]}" -gt 0 ]; then
            echo "以下平台本次 Release 暂无软件包，等待后续构建补齐：${unavailable_targets[*]}"
          fi

          present_targets=()
          for target in "${release_targets[@]}"; do
            if [ -n "${asset_by_target[$target]+set}" ]; then
              present_targets+=("$target")
            fi
          done

          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            test -f "$release_dir/$asset"
          done

          cp scripts/install-anland-kde.sh "$release_dir/install-anland-kde.sh"
          chmod +x "$release_dir/install-anland-kde.sh"
          {
            printf 'format=1\n'
            printf 'release_tag=%s\n' "$rolling_release_tag"
            printf 'revision=run-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'generated_at=%s\n' "$build_time"
            for target in "${present_targets[@]}"; do
              printf '%s=%s\n' "$(archive_target_for_target "$target")" "${asset_by_target[$target]}"
            done
          } > "$release_dir/anland-kde-manifest"

          format_target_list() {
            local target text=""
            for target in "$@"; do
              text="${text}${text:+、}$(target_label "$target")"
            done
            printf '%s\n' "${text:-无}"
          }

          updated_target_list="$(format_target_list "${updated_targets[@]}")"
          reused_target_list="$(format_target_list "${reused_targets[@]}")"
          unavailable_target_list="$(format_target_list "${unavailable_targets[@]}")"
          if [ "${#reused_targets[@]}" -eq 0 ] && [ "${#unavailable_targets[@]}" -eq 0 ]; then
            replacement_note="本次构建重新生成全部五个平台的软件包。"
          else
            replacement_note="本次替换：${updated_target_list}"
            if [ "${#reused_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；沿用 ${previous_tag}：${reused_target_list}"
            fi
            if [ "${#unavailable_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；本 Release 暂无：${unavailable_target_list}"
            fi
            replacement_note="${replacement_note}。"
          fi

          release_tag="$rolling_release_tag"
          release_asset_table="$(printf '%s\n' \
            '| 压缩包 | 目标系统 | 构建时间 |' \
            '| --- | --- | --- |')"
          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${asset}"
            release_asset_table="${release_asset_table}"$'\n'"| [\`${asset}\`](${asset_url}) | $(target_label "$target") | ${asset_time_by_target[$target]} |"
          done
          release_source_list=""
          for target in "${present_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：${asset_source_by_target[$target]}"
          done
          for target in "${unavailable_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：本 Release 暂无软件包，等待后续构建补齐"
          done
          release_notes="$(printf '%s\n' \
            '# Anland KDE Wayland 预编译包' \
            '' \
            '这是供 Droidspaces Wayland RootFS 使用的固定滚动 ARM64/aarch64 包 Release。每次更新只替换本次成功的平台，其他平台资产保持不变；尚未构建过的平台会在后续构建中补齐。' \
            '' \
            '## 发布资产' \
            '' \
            "$release_asset_table" \
            '' \
            '压缩包文件名中的 `kwin-版本` 来自该发行版实际生成的 KWin 包；不同发行版的版本可以不同。' \
            '' \
            '每个压缩包只包含对应系统的 patched KWin/Xwayland 包；`anland-kde-manifest` 精确映射目标系统到资产。' \
            '' \
            '## 构建详情' \
            '' \
            "- 构建目标：${BUILD_TARGET_INPUT}" \
            "- ${replacement_note}" \
            "- Release 生成时间：${build_time}" \
            '- 构建时间取自压缩包内的构建元数据；缺失时显示固定 Release 的发布时间。' \
            "- 软件包请求 ID / Package request ID: ${REQUEST_ID:-manual-${GITHUB_RUN_ID}}" \
            "- 软件包工作流运行号：${GITHUB_RUN_ID}" \
            "- 本次构建源码（仅更新资产）：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）" \
            "- 工作流提交：\`${GITHUB_SHA}\`" \
            '- 架构：仅 ARM64/aarch64' \
            '' \
            '## 资产来源' \
            "$release_source_list" \
            '')"
          # 先备份当前滚动 Release；原地重写失败时恢复原资产，避免丢失可用包。
          rollback_dir="$RUNNER_TEMP/anland-kde-rolling-backup"
          release_mutated=false
          release_exists=false
          rm -rf "$rollback_dir"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            mkdir -p "$rollback_dir"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$rollback_dir"
          fi

          asset_matches_target() {
            local target="$1"
            local name="$2"
            local prefix arch legacy
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            case "$target" in
              Arch) legacy='anland-kde-arch-aarch64.tar.gz' ;;
              Debian13) legacy='anland-kde-debian13-arm64.tar.gz' ;;
              ubuntu2604) legacy='anland-kde-ubuntu2604-arm64.tar.gz' ;;
              Fedora43) legacy='anland-kde-fedora43-aarch64.tar.gz' ;;
              Fedora44) legacy='anland-kde-fedora44-aarch64.tar.gz' ;;
              *) return 1 ;;
            esac
            case "$name" in
              "${prefix}"*"-${arch}.tar.gz"|"$legacy") return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_stale_target_assets() {
            local target="$1"
            local desired="$2"
            local asset_rows asset_id asset_name
            asset_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 1
            while IFS=$'\t' read -r asset_id asset_name; do
              [ -n "$asset_id" ] || continue
              if asset_matches_target "$target" "$asset_name" && [ "$asset_name" != "$desired" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done <<< "$asset_rows"
          }

          delete_release_asset_named() {
            local asset_name="$1"
            local asset_ids asset_id
            asset_ids="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq ".assets[] | select(.name == \"$asset_name\") | .id")" || return 1
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$asset_ids"
          }

          restore_rollback_assets() {
            local rollback_asset rollback_name current_rows current_id current_name

            # Restore packages and the installer first. The old manifest is uploaded
            # last, so it never points at an asset that has not been restored yet.
            for rollback_asset in "$rollback_dir"/*; do
              rollback_name="${rollback_asset##*/}"
              [ "$rollback_name" = 'anland-kde-manifest' ] && continue
              gh release upload "$release_tag" "$rollback_asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo "恢复资产失败：$rollback_name" >&2
            done
            if [ -f "$rollback_dir/anland-kde-manifest" ]; then
              gh release upload "$release_tag" "$rollback_dir/anland-kde-manifest" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo '恢复软件包清单失败。' >&2
            fi

            # Removing extras is best effort. A failed deletion only leaves an
            # unreferenced asset; it must never make the prior Release unavailable.
            current_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 0
            while IFS=$'\t' read -r current_id current_name; do
              [ -n "$current_id" ] || continue
              if [ ! -f "$rollback_dir/$current_name" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$current_id" || \
                  echo "未能删除恢复后的多余资产：$current_name" >&2
              fi
            done <<< "$current_rows"
          }

          restore_previous_release() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$release_mutated" = true ] && [ -d "$rollback_dir" ]; then
              echo "滚动 Release 原地更新失败，尝试恢复旧资产..." >&2
              set +e
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                restore_rollback_assets
              else
                gh release create "$release_tag" "$rollback_dir"/* \
                  --draft \
                  --latest=false \
                  --target "$GITHUB_SHA" \
                  --title 'Anland KDE Wayland 预编译包' \
                  --notes '自动恢复：本次滚动 Release 更新失败，已恢复上一份可用资产。'
                gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
              fi
              set -e
            fi
            exit "$status"
          }
          trap restore_previous_release EXIT

          if [ "$release_exists" = true ]; then
            release_mutated=true
            updated_uploads=()
            for target in "${updated_targets[@]}"; do
              updated_uploads+=("$release_dir/${asset_by_target[$target]}")
            done
            gh release upload "$release_tag" "${updated_uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/install-anland-kde.sh" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/anland-kde-manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            delete_release_asset_named 'SHA256SUMS'
            for target in "${updated_targets[@]}"; do
              delete_stale_target_assets "$target" "${asset_by_target[$target]}"
            done
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Anland KDE Wayland 预编译包' \
              --notes "$release_notes" \
              --draft=false \
              --latest=false
          else
            gh release create "$release_tag" "$release_dir"/* \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title 'Anland KDE Wayland 预编译包' \
              --notes "$release_notes"
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          release_mutated=false
          trap - EXIT

          sync_gitee_release() (
            local gitee_api='https://gitee.com/api/v5'
            local gitee_repository gitee_owner gitee_repo gitee_target_commitish
            local gitee_release_id gitee_release_exists=false gitee_status
            local sync_dir gitee_repo_json gitee_release_json gitee_attachments_json
            local gitee_response_json gitee_payload_json gitee_notes_path
            local target asset gitee_asset_url gitee_asset_table gitee_release_notes
            local -A gitee_target_needs_sync=()

            if [ -z "${GITEE_TOKEN:-}" ]; then
              echo '未配置 GITEE_TOKEN，无法同步 Gitee Release。' >&2
              return 1
            fi
            gitee_repository="$(printf '%s' "$GITEE_RELEASE_REPOSITORY" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            case "$gitee_repository" in
              */*)
                gitee_owner="${gitee_repository%%/*}"
                gitee_repo="${gitee_repository#*/}"
                ;;
              *)
                echo "GITEE_RELEASE_REPOSITORY 必须是 owner/repo：$gitee_repository" >&2
                return 1
                ;;
            esac
            case "$gitee_owner" in ''|*[!A-Za-z0-9._-]*)
              echo "GITEE_RELEASE_REPOSITORY 格式无效：$gitee_repository" >&2
              return 1
              ;;
            esac
            case "$gitee_repo" in ''|*/*|*[!A-Za-z0-9._-]*)
              echo "GITEE_RELEASE_REPOSITORY 格式无效：$gitee_repository" >&2
              return 1
              ;;
            esac

            if ! sync_dir="$(mktemp -d)" || [ -z "$sync_dir" ] || [ ! -d "$sync_dir" ]; then
              echo '无法创建 Gitee 同步临时目录。' >&2
              return 1
            fi
            trap 'rm -rf "$sync_dir"' EXIT
            gitee_repo_json="$sync_dir/repository.json"
            gitee_release_json="$sync_dir/release.json"
            gitee_attachments_json="$sync_dir/attachments.json"
            gitee_response_json="$sync_dir/response.json"
            gitee_payload_json="$sync_dir/payload.json"

            gitee_read() {
              local output_file="$1"
              local url="$2"
              curl --silent --show-error --location \
                --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
                --output "$output_file" --write-out '%{http_code}' \
                --header "Authorization: token ${GITEE_TOKEN}" \
                "$url"
            }

            gitee_write() {
              local method="$1"
              local output_file="$2"
              local url="$3"
              shift 3
              curl --silent --show-error --location \
                --connect-timeout 20 --max-time 300 \
                --request "$method" \
                --output "$output_file" --write-out '%{http_code}' \
                --header "Authorization: token ${GITEE_TOKEN}" \
                "$@" "$url"
            }

            require_gitee_success() {
              local status="$1"
              local response_file="$2"
              case "$status" in
                200|201|204) return 0 ;;
                *)
                  echo "Gitee API 返回 HTTP ${status}：" >&2
                  cat "$response_file" >&2 || true
                  return 1
                  ;;
              esac
            }

            if ! gitee_status="$(gitee_read "$gitee_repo_json" \
              "$gitee_api/repos/$gitee_owner/$gitee_repo")"; then
              echo '读取 Gitee 仓库信息失败。' >&2
              return 1
            fi
            require_gitee_success "$gitee_status" "$gitee_repo_json" || return 1
            if ! gitee_target_commitish="$(jq -er '.default_branch | strings | select(length > 0)' \
              "$gitee_repo_json")"; then
              echo 'Gitee 仓库没有可用的默认分支，无法创建 Release。' >&2
              return 1
            fi

            if ! gitee_status="$(gitee_read "$gitee_release_json" \
              "$gitee_api/repos/$gitee_owner/$gitee_repo/releases/tags/$release_tag")"; then
              echo '读取 Gitee 固定 Release 失败。' >&2
              return 1
            fi
            case "$gitee_status" in
              200)
                if gitee_release_id="$(jq -er '.id | numbers | tostring' "$gitee_release_json" 2>/dev/null)"; then
                  gitee_release_exists=true
                elif ! jq -e '. == null' "$gitee_release_json" >/dev/null; then
                  echo 'Gitee 固定 Release 响应格式无效。' >&2
                  return 1
                fi
                ;;
              404)
                ;;
              *)
                require_gitee_success "$gitee_status" "$gitee_release_json" || return 1
                ;;
            esac

            if [ "$gitee_release_exists" = false ]; then
              if ! jq -nc \
                --arg tag "$release_tag" \
                --arg name 'Anland KDE Wayland 预编译包（Gitee 镜像）' \
                --arg body '正在从 GitHub 固定滚动 Release 同步软件包。' \
                --arg target "$gitee_target_commitish" \
                '{tag_name: $tag, name: $name, body: $body, target_commitish: $target, prerelease: false}' \
                > "$gitee_payload_json"; then
                echo '生成 Gitee Release 创建请求失败。' >&2
                return 1
              fi
              if ! gitee_status="$(gitee_write POST "$gitee_release_json" \
                "$gitee_api/repos/$gitee_owner/$gitee_repo/releases" \
                --header 'Content-Type: application/json' \
                --data-binary "@$gitee_payload_json")"; then
                echo '创建 Gitee 固定 Release 失败。' >&2
                return 1
              fi
              require_gitee_success "$gitee_status" "$gitee_release_json" || return 1
              if ! gitee_release_id="$(jq -er '.id | numbers | tostring' "$gitee_release_json")"; then
                echo 'Gitee 创建 Release 后未返回 ID。' >&2
                return 1
              fi
            fi

            gitee_list_attachments() {
              if ! gitee_status="$(gitee_read "$gitee_attachments_json" \
                "$gitee_api/repos/$gitee_owner/$gitee_repo/releases/$gitee_release_id/attach_files?per_page=100")"; then
                echo '读取 Gitee Release 附件失败。' >&2
                return 1
              fi
              require_gitee_success "$gitee_status" "$gitee_attachments_json" || return 1
              if ! jq -e 'type == "array"' "$gitee_attachments_json" >/dev/null; then
                echo 'Gitee Release 附件响应格式无效。' >&2
                return 1
              fi
              if [ "$(jq -r 'length' "$gitee_attachments_json")" -ge 100 ]; then
                echo 'Gitee 固定 Release 的附件达到单页上限，拒绝在未完整读取附件列表时同步。' >&2
                return 1
              fi
            }

            gitee_attachment_exists() {
              jq -e --arg name "$1" 'any(.[]?; .name == $name)' \
                "$gitee_attachments_json" >/dev/null
            }

            gitee_delete_attachment() {
              local attachment_id="$1"
              if ! gitee_status="$(gitee_write DELETE "$gitee_response_json" \
                "$gitee_api/repos/$gitee_owner/$gitee_repo/releases/$gitee_release_id/attach_files/$attachment_id")"; then
                echo "删除 Gitee 附件 ${attachment_id} 失败。" >&2
                return 1
              fi
              require_gitee_success "$gitee_status" "$gitee_response_json"
            }

            gitee_delete_named_attachments() {
              local desired_name="$1"
              local attachment_id attachment_name
              while IFS=$'\t' read -r attachment_id attachment_name; do
                [ -n "$attachment_id" ] || continue
                gitee_delete_attachment "$attachment_id" || return 1
              done < <(jq -r --arg name "$desired_name" \
                '.[]? | select(.name == $name) | [.id, .name] | @tsv' "$gitee_attachments_json")
            }

            gitee_delete_target_attachments() {
              local package_target="$1"
              local keep_name="$2"
              local attachment_id attachment_name
              while IFS=$'\t' read -r attachment_id attachment_name; do
                [ -n "$attachment_id" ] || continue
                if asset_matches_target "$package_target" "$attachment_name" && \
                    { [ -z "$keep_name" ] || [ "$attachment_name" != "$keep_name" ]; }; then
                  gitee_delete_attachment "$attachment_id" || return 1
                fi
              done < <(jq -r '.[]? | [.id, .name] | @tsv' "$gitee_attachments_json")
            }

            gitee_upload_attachment() {
              local asset_path="$1"
              local asset_name="${asset_path##*/}"
              local attempt=1
              local max_attempts=3

              # 附件上传链路可能在 HTTP/2 或 Expect: 100-continue 协商时无响应；
              # 超时后先检查服务端是否已实际接收该附件，避免重复上传。
              while [ "$attempt" -le "$max_attempts" ]; do
                gitee_status=''
                if gitee_status="$(curl --silent --show-error --http1.1 \
                  --connect-timeout 20 --max-time 180 --speed-time 60 --speed-limit 1024 \
                  --request POST \
                  --output "$gitee_response_json" --write-out '%{http_code}' \
                  --header "Authorization: token ${GITEE_TOKEN}" \
                  --header 'Accept: application/json' \
                  --header 'Expect:' \
                  --form "file=@${asset_path}" \
                  "$gitee_api/repos/$gitee_owner/$gitee_repo/releases/$gitee_release_id/attach_files")" && \
                    require_gitee_success "$gitee_status" "$gitee_response_json"; then
                  return 0
                fi

                # 请求超时后服务端可能仍已写入附件，不能盲目重传。
                if gitee_list_attachments && gitee_attachment_exists "$asset_name"; then
                  echo "Gitee 已接收附件但未返回响应：$asset_name"
                  return 0
                fi

                case "$gitee_status" in
                  ''|000|408|429|5??|522|524)
                    ;;
                  *)
                    echo "上传 Gitee 附件失败：$asset_name" >&2
                    return 1
                    ;;
                esac
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "上传 Gitee 附件失败：$asset_name" >&2
                  return 1
                fi
                echo "Gitee 附件上传未完成，${attempt}/${max_attempts} 次后重试：$asset_name" >&2
                sleep "$((attempt * 5))"
                attempt=$((attempt + 1))
              done
            }

            gitee_download_url_for_asset() {
              local asset_name="$1"
              local attachment_row attachment_id browser_download_url
              if ! attachment_row="$(jq -er --arg name "$asset_name" \
                '[.[]? | select(.name == $name)] | if length == 1 then .[0] | [.id, (.browser_download_url // "")] | @tsv else error("asset count") end' \
                "$gitee_attachments_json")"; then
                return 1
              fi
              attachment_id="${attachment_row%%$'\t'*}"
              browser_download_url="${attachment_row#*$'\t'}"
              if [ -n "$browser_download_url" ] && [ "$browser_download_url" != "$attachment_row" ]; then
                printf '%s\n' "$browser_download_url"
              else
                printf '%s\n' \
                  "https://gitee.com/$gitee_owner/$gitee_repo/attach_files/$attachment_id/download"
              fi
            }

            gitee_list_attachments || return 1
            for target in "${updated_targets[@]}"; do
              gitee_target_needs_sync["$target"]=1
            done
            # 首次同步或此前失败后，补齐镜像中缺失的其他平台资产。
            for target in "${release_targets[@]}"; do
              asset="${asset_by_target[$target]}"
              if ! gitee_attachment_exists "$asset"; then
                gitee_target_needs_sync["$target"]=1
              fi
            done

            # 只有同名重传时才必须先删；版本变化时先上传新包，旧 manifest 仍可用。
            for target in "${release_targets[@]}"; do
              [ -n "${gitee_target_needs_sync[$target]:-}" ] || continue
              asset="${asset_by_target[$target]}"
              if gitee_attachment_exists "$asset"; then
                gitee_delete_target_attachments "$target" '' || return 1
              fi
            done
            for target in "${release_targets[@]}"; do
              [ -n "${gitee_target_needs_sync[$target]:-}" ] || continue
              gitee_upload_attachment "$release_dir/${asset_by_target[$target]}" || return 1
            done

            gitee_list_attachments || return 1
            # 旧 manifest 在新包和安装器可用前保持不变，避免它指向半成品。
            gitee_delete_named_attachments 'install-anland-kde.sh' || return 1
            gitee_delete_named_attachments 'SHA256SUMS' || return 1
            gitee_upload_attachment "$release_dir/install-anland-kde.sh" || return 1
            gitee_delete_named_attachments 'anland-kde-manifest' || return 1
            gitee_upload_attachment "$release_dir/anland-kde-manifest" || return 1

            gitee_list_attachments || return 1
            # manifest 已指向新包；现在才清理已失去引用的旧版本资产。
            for target in "${release_targets[@]}"; do
              [ -n "${gitee_target_needs_sync[$target]:-}" ] || continue
              gitee_delete_target_attachments "$target" "${asset_by_target[$target]}" || return 1
            done
            gitee_list_attachments || return 1
            for target in "${release_targets[@]}"; do
              asset="${asset_by_target[$target]}"
              if [ "$(jq -r --arg name "$asset" '[.[]? | select(.name == $name)] | length' \
                "$gitee_attachments_json")" -ne 1 ]; then
                echo "Gitee Release 中未找到唯一的资产：$asset" >&2
                return 1
              fi
            done
            for asset in install-anland-kde.sh anland-kde-manifest; do
              if [ "$(jq -r --arg name "$asset" '[.[]? | select(.name == $name)] | length' \
                "$gitee_attachments_json")" -ne 1 ]; then
                echo "Gitee Release 中未找到唯一的资产：$asset" >&2
                return 1
              fi
            done

            gitee_asset_table="$(printf '%s\n' \
              '| 压缩包 | 目标系统 | 构建时间 |' \
              '| --- | --- | --- |')"
            for target in "${release_targets[@]}"; do
              asset="${asset_by_target[$target]}"
              if ! gitee_asset_url="$(gitee_download_url_for_asset "$asset")"; then
                echo "无法生成 Gitee 资产下载链接：$asset" >&2
                return 1
              fi
              gitee_asset_table="${gitee_asset_table}"$'\n'"| [\`${asset}\`](${gitee_asset_url}) | $(target_label "$target") | ${asset_time_by_target[$target]} |"
            done
            gitee_release_notes="$(printf '%s\n' \
              '# Anland KDE Wayland 预编译包（Gitee 镜像）' \
              '' \
              '此固定滚动 Release 由 GitHub Actions 同步。GitHub 是发布源；若镜像暂时不可用，请使用 GitHub Release。' \
              '' \
              "GitHub Release：[${GITHUB_REPOSITORY}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release_tag})" \
              '' \
              '## 发布资产' \
              '' \
              "$gitee_asset_table" \
              '' \
              '压缩包内包含对应系统的 patched KWin/Xwayland 包；`anland-kde-manifest` 精确映射目标系统到资产。' \
              '' \
              "- Gitee 同步时间：${build_time}" \
              "- 本次 GitHub 构建目标：${BUILD_TARGET_INPUT}" \
              '- 架构：仅 ARM64/aarch64' \
              '')"
            gitee_notes_path="$sync_dir/release-notes.md"
            printf '%s\n' "$gitee_release_notes" > "$gitee_notes_path"
            if ! jq -nc \
              --arg tag "$release_tag" \
              --arg name 'Anland KDE Wayland 预编译包（Gitee 镜像）' \
              --rawfile body "$gitee_notes_path" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: false}' \
              > "$gitee_payload_json"; then
              echo '生成 Gitee Release 更新请求失败。' >&2
              return 1
            fi
            if ! gitee_status="$(gitee_write PATCH "$gitee_response_json" \
              "$gitee_api/repos/$gitee_owner/$gitee_repo/releases/$gitee_release_id" \
              --header 'Content-Type: application/json' \
              --data-binary "@$gitee_payload_json")"; then
              echo '更新 Gitee Release 说明失败。' >&2
              return 1
            fi
            require_gitee_success "$gitee_status" "$gitee_response_json" || return 1
            echo "已同步 Gitee Release：https://gitee.com/$gitee_owner/$gitee_repo/releases/tag/$release_tag"
          )

          if ! sync_gitee_release; then
            echo '::warning title=Gitee Release 镜像同步失败::GitHub Release 已成功更新；Gitee 会在下一次软件包发布时重试同步。'
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo '### Gitee Release 镜像未同步'
                echo
                echo 'GitHub 固定 Release 已成功更新；本次 Gitee 同步失败，旧镜像保持不变。'
                echo '请查看此步骤日志中的 Gitee API 响应；下一次软件包发布会自动重试。'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"
